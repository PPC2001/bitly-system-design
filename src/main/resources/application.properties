# Spring Application
spring.application.name=bitly-clone

# PostgreSQL Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/bitly_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bitly_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bitly_pass}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5

# Server Configuration
server.port=${SERVER_PORT:8082}

# Application Custom Configuration
app.base-url=${APP_BASE_URL:http://localhost:8082}
app.short-code-length=7
app.cache.l1.max-size=10000
app.cache.l1.ttl-seconds=300
app.cache.l2.ttl-seconds=86400
app.cache.negative-ttl-seconds=60
app.snowflake.node-id=1

# Actuator & Management Endpoints
management.endpoints.web.exposure.include=health,metrics,prometheus
