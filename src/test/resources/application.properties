# Test configurations
spring.application.name=bitly-clone-test

# Application test defaults
app.base-url=http://localhost:8082
app.short-code-length=7
app.cache.l1.max-size=10000
app.cache.l1.ttl-seconds=300
app.cache.l2.ttl-seconds=86400
app.cache.negative-ttl-seconds=60
app.snowflake.node-id=1

# Disable Flyway and Datasource / JPA / Redis during unit tests
spring.flyway.enabled=false
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
